# MongoDB settings for the Marketly server (installed as /etc/mongod.conf by install.sh when that file has no
# replica set yet; the original is kept as /etc/mongod.conf.before-marketly). Same folders as the Ubuntu package.
#
# After changing it: sudo systemctl restart mongod

# where the data lives (back up with deploy/linux/backup.sh, not by copying this folder while mongod runs)
storage:
  dbPath: /var/lib/mongodb

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# this machine only: the Marketly server is the one client, so MongoDB is never reachable from the network
net:
  port: 27017
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# a one-member replica set: Marketly needs transactions, which need a replica set. npm run prod:db-setup
# (run by install.sh) initiates it once with the member 127.0.0.1:27017.
replication:
  replSetName: rs0
