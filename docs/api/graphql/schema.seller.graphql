"""
What the seller can use to record a shipment or buy a label (SellerOrderDetail): enabled carriers and services with
tracking formats, whether labels can be bought in Seller Center, and the default package that pre-fills the form.
Only the caller's own shipping settings.
"""
type ShippingSellerSetup @areas(in: [SELLER]) {
  carriers: [ShippingSetupCarrier!]!
  "Labels can be bought in Seller Center: the seller turned on Buy labels and at least one enabled service supports labels"
  labelPurchaseAvailable: Boolean!
  "Why label purchase is off, e.g. Turn on Buy labels in Shipping settings"
  labelUnavailableReason: String
  "Package that pre-fills the form; null when the seller has not saved one"
  defaultPackage: ShippingPackage
  "e.g. Ships in 1 business day · order by 2:00 PM PT to ship today"
  dispatchLabel: String!
}

"A carrier the seller can choose when recording tracking"
type ShippingSetupCarrier @areas(in: [SELLER]) {
  "ups, usps, fedex, ontrac, other"
  code: String!
  name: String!
  "Carrier events arrive automatically (webhook or polling); otherwise tracking is checked by format only"
  trackingConnected: Boolean!
  services: [ShippingSetupService!]!
}

type ShippingSetupService @areas(in: [SELLER]) {
  id: UUID!
  code: String!
  "e.g. UPS Ground"
  name: String!
  transitMinDays: Int!
  transitMaxDays: Int!
  "A label can be bought through Marketly for this service"
  labelSupported: Boolean!
  "Regex the tracking number must match (checked before saving)"
  trackingPattern: String
}

"Parcel size and weight saved by the seller"
type ShippingPackage @areas(in: [SELLER]) {
  weightGrams: Int!
  lengthCm: Int
  widthCm: Int
  heightCm: Int
  "e.g. Medium box · 30 × 20 × 15 cm · 1.2 kg"
  label: String!
}

extend type Query {
  "Carriers, services, label purchase and the default package for the record-shipment and buy-label forms (caller's own settings)"
  myShippingSetup: ShippingSellerSetup! @areas(in: [SELLER]) @auth(requires: SELLER, permission: "shipping.seller-shipments.view") @source(module: "shipping", fn: "getSellerShippingSetup")
  "Track one package (store: the customer's or guest's own order; seller: own shipments)"
  shipment(id: UUID!): Shipment @areas(in: [STORE, SELLER]) @source(module: "shipping", fn: "getShipment")
}

extend type OrderGroup {
  "Packages of this seller group (partial shipments give several). Default kinds: OUTBOUND and REPLACEMENT."
  shipments(kinds: [ShipmentKind!]): [Shipment!]! @source(module: "shipping", fn: "listShipmentsForGroups")
  "Open and recent delivery exceptions on the seller's own group that need its response"
  deliveryExceptions: [DeliveryException!]! @areas(in: [SELLER]) @auth(requires: SELLER, permission: "shipping.seller-shipments.view") @source(module: "shipping", fn: "listExceptionsForOrder")
}

extend type Order

extend type Offer {
  """
  Default delivery option for this offer at a postal code (or the shopper's saved or default location when omitted).
  Seller area: only the caller's own offers are reachable (myOffers, myOffer); the postal code defaults to the market default.
  """
  deliveryEstimate(postalCode: String): DeliveryEstimate @areas(in: [STORE, SELLER]) @source(module: "shipping", fn: "estimateOffers") @cost(weight: 2)
}

extend type Seller

extend type ReturnReplacement {
  "The replacement or exchange parcel (a REPLACEMENT shipment) with tracking steps and events. Null until it is recorded."
  shipment: Shipment @source(module: "shipping", fn: "shipmentsForReplacements")
}

# ---------------------------------------------------------------- module: support

"""
A help case or dispute: who handles it, the next action and who must take it, linked items, the labelled conversation,
offers, decision, remedies, appeal and reopen rules.
Store and seller see their side (no internal notes). Admin adds parties, purchase terms at order time, shipment evidence,
evidence files, deadlines and history (dispute review).
"""
type Case {
  id: UUID!
  "CS-NNNNNN"
  ref: String!
  kind: CaseKind!
  subject: String!
  category: CaseCategory!
  priority: CasePriority!
  status: CaseStatus!
  "e.g. Waiting on seller"
  statusLabel: String!
  openedAt: DateTime!
  updatedAt: DateTime!
  "Not resolved or closed"
  open: Boolean!
  handledBy: CaseHandler!
  nextAction: CaseNextAction!
  expectedResponse: Deadline
  "e.g. By Fri, Oct 9, 5:00 PM PT / Closed Aug 28"
  expectedReply: String!
  orderId: UUID
  orderRef: String
  "Order items the case is about, with their current state"
  items: [CaseItem!]!
  returnId: UUID
  returnRef: String
  "Messages visible to the caller, oldest first. Internal notes (role INTERNAL_NOTE, audience INTERNAL) only in Admin Center."
  messages: [CaseMessage!]!
  attachments: [MediaRef!]!
  offers: [CaseOffer!]!
  decision: CaseDecision
  "Refund, replacement or other remedies with their progress"
  remedies: [CaseRemedy!]!
  appeal: CaseAppeal
  reopenUntil: DateTime
  "e.g. Stays open until the refund is sent; reopen within 30 days if it doesn't arrive"
  reopenRules: String!
  timeline: [TimelineEvent!]!
  "What the caller may do now"
  can: CaseActions! @areas(in: [STORE, SELLER])
  "Marketly support is following or deciding the case"
  marketplaceInvolved: Boolean! @areas(in: [SELLER, ADMIN])
  "Dispute evidence from both parties and staff"
  evidence: [CaseEvidence!]! @areas(in: [SELLER, ADMIN])
}

enum CaseKind {
  CUSTOMER_HELP
  ORDER_PROBLEM
  DISPUTE
  SELLER_REQUEST
}

enum CasePriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum CaseStatus {
  OPEN
  WAITING_ON_SELLER
  WAITING_ON_CUSTOMER
  ESCALATED
  DECISION_MADE
  APPEALED
  RESOLVED
  CLOSED
  REOPENED
}

"Case topic with its response targets"
type CaseCategory {
  "e.g. delivery_late, return_dispute, fees_payouts"
  key: String!
  "e.g. Delivery, late item"
  label: String!
  firstResponseBusinessHours: Int!
  resolutionBusinessDays: Int!
}

type CaseHandler {
  kind: CaseHandlerKind!
  "e.g. Casa Verde Home (seller) / Isabel Cruz, Marketly support"
  name: String!
  staff: Actor
  team: String
  "Marketly support is following a seller-handled case"
  supportFollowing: Boolean!
}

enum CaseHandlerKind {
  SELLER
  OFFICIAL_STORE
  MARKETPLACE_SUPPORT
}

type CaseNextAction {
  "e.g. Casa Verde Home confirms tracking or offers a refund"
  label: String!
  whoMustAct: CaseParty!
  due: Deadline
  youNeedToAct: Boolean!
  "e.g. If they miss it, Marketly steps in"
  note: String
}

enum CaseParty {
  CUSTOMER
  SELLER
  MARKETPLACE
  NONE
}

"An order item linked to the case"
type CaseItem {
  orderItemId: UUID!
  title: String!
  options: [VariantOption!]!
  quantity: Int!
  price: Money!
  imageUrl: URL
  ownerType: CaseOwnerType!
  "Null for the Official Store"
  sellerId: UUID
  sellerName: String!
  "e.g. Package 3 of 3"
  packageLabel: String
  "e.g. Delayed"
  itemStatus: String!
  "e.g. Was Sep 22 · now Oct 12"
  estimate: String
}

enum CaseOwnerType {
  OFFICIAL
  SELLER
}

"A message on a case, labelled by who wrote it and who can see it"
type CaseMessage {
  id: UUID!
  author: Actor!
  "e.g. Isabel Cruz, Marketly support"
  authorLabel: String!
  role: CaseMessageRole!
  audience: CaseMessageAudience!
  body: String!
  attachments: [MediaRef!]!
  at: DateTime!
}

"INTERNAL_NOTE is only ever returned in Admin Center"
enum CaseMessageRole {
  CUSTOMER
  SELLER
  MARKETLY_STAFF
  INTERNAL_NOTE
  SYSTEM
}

"INTERNAL is only ever returned in Admin Center"
enum CaseMessageAudience {
  ALL
  CUSTOMER
  SELLER
  INTERNAL
}

"An offer from the seller or Marketly (ship by a date, refund, replacement)"
type CaseOffer {
  id: UUID!
  from: CaseOfferFrom!
  kind: CaseOfferKind!
  amount: Money
  shipBy: Date
  note: String
  status: CaseOfferStatus!
  respondBy: DateTime
  createdAt: DateTime!
}

enum CaseOfferFrom {
  SELLER
  MARKETPLACE
}

enum CaseOfferKind {
  SHIP_BY_DATE
  REFUND
  PARTIAL_REFUND
  REPLACEMENT
}

enum CaseOfferStatus {
  OPEN
  ACCEPTED
  DECLINED
  EXPIRED
  WITHDRAWN
}

type CaseDecision {
  outcome: CaseOutcome!
  "Shared with both parties, citing the purchase terms"
  reason: String!
  decidedBy: Actor!
  decidedAt: DateTime!
  publishedAt: DateTime
  appealDeadline: DateTime
  "e.g. A different Marketly team member reviews, replies within 3 business days"
  appealRoute: String!
  "True after an appeal decision"
  final: Boolean!
}

enum CaseOutcome {
  CUSTOMER_FAVORED
  SELLER_FAVORED
  SHARED
  NO_FAULT
  INFORMATION_ONLY
}

"A remedy promised on the case. Refund remedies follow the refund request: approved is not money sent."
type CaseRemedy {
  id: UUID!
  kind: CaseRemedyKind!
  amount: Money
  chargedTo: CaseRemedyChargedTo
  orderItemIds: [UUID!]!
  status: CaseRemedyStatus!
  statusLabel: String!
  "Refund: Requested, Approved, Processing, Sent"
  track: [String!]!
  currentStep: Int
  dueAt: DateTime
  "e.g. Visa •••• 4417"
  destination: String
  "e.g. Approved means we agreed to refund you; it isn't money in your account yet"
  note: String
  refundRequestId: UUID @areas(in: [SELLER, ADMIN])
  replacementId: UUID @areas(in: [SELLER, ADMIN])
}

"GOODWILL_CREDIT needs the wallet module (phase 3); until then it is a platform-funded partial refund"
enum CaseRemedyKind {
  REFUND
  PARTIAL_REFUND
  REPLACEMENT
  RETURN_LABEL
  GOODWILL_CREDIT
  SHIP_BY_DEADLINE
  NONE
}

enum CaseRemedyChargedTo {
  SELLER
  PLATFORM
  SHARED
}

enum CaseRemedyStatus {
  PENDING_APPROVAL
  APPROVED
  IN_PROGRESS
  COMPLETED
  FAILED
  CANCELLED
}

type CaseAppeal {
  id: UUID!
  by: Actor!
  reason: String!
  attachments: [MediaRef!]!
  submittedAt: DateTime!
  status: CaseAppealStatus!
  "Always a different person from the original decider"
  reviewer: Actor
  decidedAt: DateTime
  outcome: String
}

enum CaseAppealStatus {
  SUBMITTED
  IN_REVIEW
  DECISION_STANDS
  OVERTURNED
}

type CaseActions @areas(in: [STORE, SELLER]) {
  reply: Boolean!
  escalate: Boolean!
  appeal: Boolean!
  reopen: Boolean!
  respondToOffer: Boolean!
  addEvidence: Boolean!
}

"Dispute evidence: photos, videos, documents, carrier records"
type CaseEvidence @areas(in: [SELLER, ADMIN]) {
  id: UUID!
  party: CaseEvidenceParty!
  kind: CaseEvidenceKind!
  media: [MediaRef!]!
  note: String
  addedBy: Actor!
  at: DateTime!
}

enum CaseEvidenceParty @areas(in: [SELLER, ADMIN]) {
  CUSTOMER
  SELLER
  STAFF
}

enum CaseEvidenceKind @areas(in: [SELLER, ADMIN]) {
  PHOTO
  VIDEO
  DOCUMENT
  TRACKING
  INVOICE
  OTHER
}

type CasePage implements Paged {
  items: [Case!]!
  nextCursor: String
  page: Int
  totalPages: Int
  total: Int
}

extend type Order {
  "Open and recent cases about this order, each with its linked items. Seller area: cases about the caller's items."
  cases: [Case!]! @source(module: "support", fn: "listCasesForOrder") @cost(weight: 5)
}

