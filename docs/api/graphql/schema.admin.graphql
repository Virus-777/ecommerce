  SELLER_CANNOT_FULFILL
  LOW_STOCK
  RECEIVING
  PICK_PACK
  RETURN_INSPECTION
  RETURN_DECISION
  APPROVAL_WAITING
  CASE_PAST_TARGET
  CASE_ESCALATED
  PAYOUT_FAILED
  PAYMENT_CHECK
  PAYMENT_MISMATCH
  CHARGEBACK
  HOLD_REVIEW
  PRODUCT_REVIEW
  APPLICATION_WAITING
  LAUNCH_REVIEW
  APPEAL_DUE
  RESTRICTION_REVIEW
  RESTRICTION_EVIDENCE
  SELLER_PERFORMANCE
  STOREFRONT_REVIEW
  TRUST_REPORT
  TRUST_RECOMMENDATION
  DATA_REQUEST
  SELLER_REPLY_OVERDUE
  MANUAL_TASK
}

enum WorkItemPriority @areas(in: [ADMIN]) {
