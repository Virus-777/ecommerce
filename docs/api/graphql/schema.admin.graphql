  IN_PROGRESS
  WAITING
  RESOLVED
  DISMISSED
}

enum WorkItemWaitingOn @areas(in: [ADMIN]) {
  SELLER
  CUSTOMER
  CARRIER
  SUPPLIER
  FINANCE
  OTHER
}

enum WorkItemSubjectType @areas(in: [ADMIN]) {
  ORDER
  ORDER_ITEM
  SHIPMENT
