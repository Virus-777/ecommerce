  "Stores a filter for another module's list screen, e.g. ops/dispatch"
  SCREEN
}

"A saved filter, own or shared"
type WorkQueueSavedFilter @areas(in: [ADMIN]) {
  id: UUID!
  name: String!
  owner: WorkQueueStaff!
  shared: Boolean!
