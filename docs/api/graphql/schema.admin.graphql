"A payout to one seller: Pending → Processing → Paid, or Failed with the bank's reason"
type Payout @areas(in: [SELLER, ADMIN]) {
  id: UUID!
  "PO-YYMMDD-NNNN"
  ref: String!
  sellerId: UUID!
  sellerName: String!
  amount: Money!
  status: PayoutStatus!
  destination: PayoutDestination!
  requestedOn: Date!
  releasedAt: DateTime
  "Paid only when the provider confirms the deposit"
