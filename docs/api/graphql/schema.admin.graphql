  "Every queue I may see (workqueues.items.view-all)"
  ALL
}

"Headline numbers on My work queues"
type WorkQueueStats @areas(in: [ADMIN]) {
  assignedToMe: Int!
  queuesILead: Int!
  overdue: Int!
