}

enum HoldReason @areas(in: [SELLER, ADMIN]) {
  CHARGEBACK
  DISPUTE
  DELIVERY_UNCONFIRMED
  NEW_SELLER
  RESTRICTION
  RISK_REVIEW
  UNUSUAL_REFUND_RATE
  IDENTITY_RECHECK
  OTHER
}

enum HoldStatus @areas(in: [SELLER, ADMIN]) {
  ACTIVE
  RELEASED
