  DELIVERY_EXCEPTION
  OFFER
  STOCK_ITEM
  PURCHASE_ORDER
  APPROVAL_REQUEST
  CASE
  RETURN
  REFUND
  PAYOUT
  PAYMENT
  RECONCILIATION_CHECK
  SELLER
  APPLICATION
  APPEAL
  RESTRICTION
  CHANGE_REQUEST
  TRUST_REPORT
  RECOMMENDATION
  CAMPAIGN
  CUSTOMER
  DATA_REQUEST
  OTHER
}

"What the item is about, with its human reference"
type WorkItemSubject @areas(in: [ADMIN]) {
  type: WorkItemSubjectType!
  id: String!
