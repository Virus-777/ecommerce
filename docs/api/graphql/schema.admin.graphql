  SELLER
}

"A goodwill credit grant with its approval"
type WalletGoodwillGrant @areas(in: [ADMIN]) @phase(n: 3) {
  id: UUID!
  amount: Money!
  reason: String!
  reasonCode: String!
  caseRef: String
  orderRef: String
  chargedTo: WalletChargedTo!
  sellerId: UUID
  state: WalletGoodwillState!
  approval: ApprovalInfo
  requestedBy: Actor!
  decidedBy: Actor
