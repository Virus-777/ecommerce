  offers(variantId: UUID, condition: OfferConditionFilter = ALL, postalCode: String, sort: OfferSort = TOTAL_COST): OfferComparison @areas(in: [STORE, ADMIN]) @source(module: "offers", fn: "compareOffers") @cost(weight: 10)
