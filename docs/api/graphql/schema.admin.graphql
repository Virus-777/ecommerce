  payout: Money!
  closingAvailable: Money!
}

type StatementReconciliationLine @areas(in: [SELLER, ADMIN]) {
  label: String!
  amount: Money!
}

type StatementPage implements Paged @areas(in: [SELLER, ADMIN]) {
  items: [Statement!]!
  nextCursor: String
  page: Int
  totalPages: Int
  total: Int
}

