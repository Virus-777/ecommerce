  "Default business days to dispatch"
  handlingDays: Int!
  "Orders before this time (market time, HH:mm) count from the same business day"
  sameDayCutoff: String
  "e.g. Ships in 1 business day · order by 2:00 PM PT to ship today"
  dispatchLabel: String!
  "e.g. Mon–Fri"
  businessDaysLabel: String!
  "Upcoming closures customers should know about (holidays, inventory days)"
  closures: [ShippingSellerClosure!]!
  "Carrier names, e.g. UPS, USPS"
  carriers: [String!]!
  methods: [ShippingSellerMethod!]!
  freeShippingThreshold: Money
  "e.g. Free Standard shipping on orders over $49 from this seller"
  freeShippingLabel: String
  "Live holiday or service notices that affect this seller's carriers"
  notices: [ShippingNotice!]!
}

type ShippingSellerClosure @areas(in: [STORE]) {
  name: String!
  from: Date!
  to: Date!
}

"A shipping method the seller offers, e.g. Standard · 3–5 business days · $5.99 or free over $49"
type ShippingSellerMethod @areas(in: [STORE]) {
  name: String!
  transitMinDays: Int!
  transitMaxDays: Int!
  "e.g. $5.99, Free, From $4.99"
  priceLabel: String!
}

extend type Query {
  "Track one package (store: the customer's or guest's own order; seller: own shipments)"
  shipment(id: UUID!): Shipment @areas(in: [STORE, SELLER]) @source(module: "shipping", fn: "getShipment")
}

extend type OrderGroup {
  "Packages of this seller group (partial shipments give several). Default kinds: OUTBOUND and REPLACEMENT."
  shipments(kinds: [ShipmentKind!]): [Shipment!]! @source(module: "shipping", fn: "listShipmentsForGroups")
}

extend type Order

extend type Offer {
  """
  Default delivery option for this offer at a postal code (or the shopper's saved or default location when omitted).
  Seller area: only the caller's own offers are reachable (myOffers, myOffer); the postal code defaults to the market default.
  """
  deliveryEstimate(postalCode: String): DeliveryEstimate @areas(in: [STORE, SELLER]) @source(module: "shipping", fn: "estimateOffers") @cost(weight: 2)
}

extend type Seller {
  "Storefront shipping section: ships from, coverage, dispatch time, carriers, methods and free-shipping threshold. Null without an active profile."
  shippingSummary: ShippingSellerSummary @areas(in: [STORE]) @source(module: "shipping", fn: "getSellerShippingSummaries")
}

extend type ReturnReplacement {
  "The replacement or exchange parcel (a REPLACEMENT shipment) with tracking steps and events. Null until it is recorded."
  shipment: Shipment @source(module: "shipping", fn: "shipmentsForReplacements")
}

# ---------------------------------------------------------------- module: support

"""
A help case or dispute: who handles it, the next action and who must take it, linked items, the labelled conversation,
offers, decision, remedies, appeal and reopen rules.
Store and seller see their side (no internal notes). Admin adds parties, purchase terms at order time, shipment evidence,
evidence files, deadlines and history (dispute review).
"""
type Case {
  id: UUID!
  "CS-YYMMDD-NNNN"
  ref: String!
  kind: CaseKind!
  subject: String!
  category: CaseCategory!
  priority: CasePriority!
  status: CaseStatus!
  "e.g. Waiting on seller"
  statusLabel: String!
  openedAt: DateTime!
  updatedAt: DateTime!
  "Not resolved or closed"
  open: Boolean!
  handledBy: CaseHandler!
  nextAction: CaseNextAction!
  expectedResponse: Deadline
  "e.g. By Fri, Oct 9, 5:00 PM PT / Closed Aug 28"
  expectedReply: String!
  orderId: UUID
  orderRef: String
  "Order items the case is about, with their current state"
  items: [CaseItem!]!
  returnId: UUID
  returnRef: String
  "Messages visible to the caller, oldest first. Internal notes (role INTERNAL_NOTE, audience INTERNAL) only in Admin Center."
  messages: [CaseMessage!]!
  attachments: [MediaRef!]!
  offers: [CaseOffer!]!
  decision: CaseDecision
  "Refund, replacement or other remedies with their progress"
  remedies: [CaseRemedy!]!
  appeal: CaseAppeal
  reopenUntil: DateTime
  "e.g. Stays open until the refund is sent; reopen within 30 days if it doesn't arrive"
  reopenRules: String!
  timeline: [TimelineEvent!]!
  "What the caller may do now"
  can: CaseActions! @areas(in: [STORE, SELLER])
}

enum CaseKind {
  CUSTOMER_HELP
  ORDER_PROBLEM
  DISPUTE
  SELLER_REQUEST
}

enum CasePriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum CaseStatus {
  OPEN
  WAITING_ON_SELLER
  WAITING_ON_CUSTOMER
  ESCALATED
  DECISION_MADE
  APPEALED
  RESOLVED
  CLOSED
  REOPENED
}

"Case topic with its response targets"
type CaseCategory {
  "e.g. delivery_late, return_dispute, fees_payouts"
  key: String!
  "e.g. Delivery, late item"
  label: String!
  firstResponseBusinessHours: Int!
  resolutionBusinessDays: Int!
}

type CaseHandler {
  kind: CaseHandlerKind!
  "e.g. Casa Verde Home (seller) / Isabel Cruz, Marketly support"
  name: String!
  staff: Actor
  team: String
  "Marketly support is following a seller-handled case"
  supportFollowing: Boolean!
}

enum CaseHandlerKind {
  SELLER
  OFFICIAL_STORE
  MARKETPLACE_SUPPORT
}

type CaseNextAction {
  "e.g. Casa Verde Home confirms tracking or offers a refund"
  label: String!
  whoMustAct: CaseParty!
  due: Deadline
  youNeedToAct: Boolean!
  "e.g. If they miss it, Marketly steps in"
  note: String
}

enum CaseParty {
  CUSTOMER
  SELLER
  MARKETPLACE
  NONE
}

"An order item linked to the case"
type CaseItem {
  orderItemId: UUID!
  title: String!
  options: [VariantOption!]!
  quantity: Int!
  price: Money!
  imageUrl: URL
  ownerType: CaseOwnerType!
  "Null for the Official Store"
  sellerId: UUID
  sellerName: String!
  "e.g. Package 3 of 3"
  packageLabel: String
  "e.g. Delayed"
  itemStatus: String!
  "e.g. Was Sep 22 · now Oct 12"
  estimate: String
}

enum CaseOwnerType {
  OFFICIAL
  SELLER
}

"A message on a case, labelled by who wrote it and who can see it"
type CaseMessage {
  id: UUID!
  author: Actor!
  "e.g. Isabel Cruz, Marketly support"
  authorLabel: String!
  role: CaseMessageRole!
  audience: CaseMessageAudience!
  body: String!
  attachments: [MediaRef!]!
  at: DateTime!
}

"INTERNAL_NOTE is only ever returned in Admin Center"
enum CaseMessageRole {
  CUSTOMER
  SELLER
  MARKETLY_STAFF
  INTERNAL_NOTE
  SYSTEM
}

"INTERNAL is only ever returned in Admin Center"
enum CaseMessageAudience {
  ALL
  CUSTOMER
  SELLER
  INTERNAL
}

"An offer from the seller or Marketly (ship by a date, refund, replacement)"
type CaseOffer {
  id: UUID!
  from: CaseOfferFrom!
  kind: CaseOfferKind!
  amount: Money
  shipBy: Date
  note: String
  status: CaseOfferStatus!
  respondBy: DateTime
  createdAt: DateTime!
}

enum CaseOfferFrom {
  SELLER
  MARKETPLACE
}

enum CaseOfferKind {
  SHIP_BY_DATE
  REFUND
  PARTIAL_REFUND
  REPLACEMENT
}

enum CaseOfferStatus {
  OPEN
  ACCEPTED
  DECLINED
  EXPIRED
  WITHDRAWN
}

type CaseDecision {
  outcome: CaseOutcome!
  "Shared with both parties, citing the purchase terms"
  reason: String!
  decidedBy: Actor!
  decidedAt: DateTime!
  publishedAt: DateTime
  appealDeadline: DateTime
  "e.g. A different Marketly team member reviews, replies within 3 business days"
  appealRoute: String!
  "True after an appeal decision"
  final: Boolean!
}

enum CaseOutcome {
  CUSTOMER_FAVORED
  SELLER_FAVORED
  SHARED
  NO_FAULT
  INFORMATION_ONLY
}

"A remedy promised on the case. Refund remedies follow the refund request: approved is not money sent."
type CaseRemedy {
  id: UUID!
  kind: CaseRemedyKind!
  amount: Money
  chargedTo: CaseRemedyChargedTo
  orderItemIds: [UUID!]!
  status: CaseRemedyStatus!
  statusLabel: String!
  "Refund: Requested, Approved, Processing, Sent"
  track: [String!]!
  currentStep: Int
  dueAt: DateTime
  "e.g. Visa •••• 4417"
  destination: String
  "e.g. Approved means we agreed to refund you; it isn't money in your account yet"
  note: String
}

"GOODWILL_CREDIT needs the wallet module (phase 3); until then it is a platform-funded partial refund"
enum CaseRemedyKind {
  REFUND
  PARTIAL_REFUND
  REPLACEMENT
  RETURN_LABEL
  GOODWILL_CREDIT
  SHIP_BY_DEADLINE
  NONE
}

enum CaseRemedyChargedTo {
  SELLER
  PLATFORM
  SHARED
}

enum CaseRemedyStatus {
  PENDING_APPROVAL
  APPROVED
  IN_PROGRESS
  COMPLETED
  FAILED
  CANCELLED
}

type CaseAppeal {
  id: UUID!
  by: Actor!
  reason: String!
  attachments: [MediaRef!]!
  submittedAt: DateTime!
  status: CaseAppealStatus!
  "Always a different person from the original decider"
  reviewer: Actor
  decidedAt: DateTime
  outcome: String
}

enum CaseAppealStatus {
  SUBMITTED
  IN_REVIEW
  DECISION_STANDS
  OVERTURNED
}

type CaseActions @areas(in: [STORE, SELLER]) {
  reply: Boolean!
  escalate: Boolean!
  appeal: Boolean!
  reopen: Boolean!
  respondToOffer: Boolean!
  addEvidence: Boolean!
}

type CasePage implements Paged {
  items: [Case!]!
  nextCursor: String
  page: Int
  totalPages: Int
  total: Int
}

extend type Order {
  "Open and recent cases about this order, each with its linked items. Seller area: cases about the caller's items."
  cases: [Case!]! @source(module: "support", fn: "listCasesForOrder") @cost(weight: 5)
}

extend type Return {
  """
  The help case or dispute opened about this return (escalation or report), as the caller may see it: the customer's
  side in the store, the seller's own side in Seller Center (no internal notes), the full case in Admin Center.
  Null when no case was opened.
  """
  case: Case @source(module: "support", fn: "getCasesForReturns")
}

extend type Customer {
  "Open cases, most recently updated first, for the account overview"
  openCases(limit: Int = 3): CasePage! @areas(in: [STORE]) @source(module: "support", fn: "listOpenCasesForCustomer")
}

extend type Seller

extend type Query {
  "Case detail for the signed-in customer (or a guest order session)"
  case(ref: String!): Case @areas(in: [STORE]) @auth(requires: SHOPPER) @source(module: "support", fn: "getCaseForCustomer")
  "My cases with who handles them, the next action and the expected reply"
  cases(open: Boolean, paging: PageInput): CasePage @areas(in: [STORE]) @auth(requires: CUSTOMER) @source(module: "support", fn: "listCasesForCustomer")
}

