# ---------------------------------------------------------------- module: reports

enum DashboardPeriod {
  TODAY
  LAST_7_DAYS
  LAST_14_DAYS
  LAST_30_DAYS
}

enum DashboardScope {
  "Whole marketplace (Admin Center)"
  PLATFORM
  "The caller's own seller account (Seller Center)"
  SELLER
}

enum MetricDateBasis {
  PLACEMENT
  PAYMENT
  SHIPMENT
  COMPLETION
  EVENT
}

enum MetricUnit {
  MONEY
  COUNT
  PERCENT
  RATIO
  DURATION_HOURS
  DAYS
}

enum MetricGroup {
  COMMERCE
  COMPANY_TRADING
  MARKETPLACE_FINANCE
  PRODUCTS_DISCOVERY
  SERVICE_SELLERS
  CUSTOMERS_MARKETING_ADS
}

"The published meaning of a metric, shown under every figure that uses it"
type MetricDefinition {
  "e.g. commerce.gross_sales"
  key: String!
  name: String!
  group: MetricGroup!
  "Plain-language meaning"
  definition: String!
  unit: MetricUnit!
  includes: [String!]!
  "e.g. tax"
  excludes: [String!]!
  defaultDateBasis: MetricDateBasis!
  "e.g. reporting currency USD"
  currencyRule: String!
  "e.g. America/Los_Angeles; days run 00:00–23:59 market time"
  timeZone: String!
  "e.g. gross sales ↔ sales after cancellations and refunds"
  relatedKeys: [String!]!
  version: Int!
  effectiveFrom: Date!
}

enum MetricDeltaUnit {
  "Percent change"
  PCT
  "Percentage points"
  PTS
}

enum MetricDirection {
  UP
  DOWN
  FLAT
}

"Change against the comparison period"
type MetricDelta {
  value: Float!
  unit: MetricDeltaUnit!
  direction: MetricDirection!
  "Whether the change is good news (refunds going down is good)"
  good: Boolean!
}

"One headline figure (KPI tile)"
type MetricValue {
  metricKey: String!
  label: String!
  value: Float!
  "Set when the unit is MONEY"
  money: Money
  "Formatted for display, e.g. $241.3k, 3,418, 2.1%"
  display: String!
  unit: MetricUnit!
  delta: MetricDelta
  "e.g. avg $71.20, 2.1% of gross, on $109.4k seller sales"
  note: String
  definition: MetricDefinition
}

"One point of a chart series"
type MetricPoint {
  date: Date!
  "Axis label, e.g. Oct 8"
  label: String!
  value: Float!
  "Set when the series unit is MONEY"
  money: Money
}

"A chart line, e.g. daily sales for the Official Store"
type MetricSeries {
  "e.g. official, marketplace, sales"
  key: String!
  label: String!
  metricKey: String!
  unit: MetricUnit!
  "day, week or month"
  granularity: String!
  points: [MetricPoint!]!
  "Sum or average over the series range, formatted like the points"
  total: MetricValue
}

"One share of a split, e.g. Official Store 58% · $140.2k"
type DashboardSplit {
  key: String!
  label: String!
  amount: Money!
  sharePct: Float!
}

enum DashboardTone {
  DANGER
  WARNING
  NEUTRAL
}

"""
Dashboard figures for one scope and period: KPI tiles, chart series and splits, each with its definition.
Admin: gross sales, orders (with AOV), marketplace fee income, refunds; series and split Official Store vs marketplace sellers.
Seller: sales (item sales before fees, by order date), orders, average order, today so far; daily sales series.
"""
type DashboardMetrics {
  scope: DashboardScope!
  period: DashboardPeriod!
  from: Date!
  to: Date!
  "Comparison range for deltas (the previous period of the same length)"
  compareFrom: Date
  compareTo: Date
  "Figures include events up to this time"
  asOf: DateTime!
  dateBasis: MetricDateBasis!
  "e.g. Gross sales by order placement date"
  basisLabel: String!
  currency: String!
  timeZone: String!
  taxIncluded: Boolean!
  "Recent days can still change (late cancellations and refunds)"
  mayStillChange: Boolean!
  kpis: [MetricValue!]!
  "Chart series. The sales chart always covers the last 14 days, whatever the period."
  series: [MetricSeries!]!
  "Admin: Official Store vs marketplace sellers. Empty for sellers."
  split: [DashboardSplit!]!
  "Definitions of every metric shown"
  definitions: [MetricDefinition!]!
  "Figures not shown because their source is off or behind, e.g. marketplace_fee_income when finance is off"
  unavailable: [String!]!
}

extend type Query

# ---------------------------------------------------------------- module: returns

"""
A return request for items of one seller package, from request to remedy.
Store: the customer's view (ReturnDetail). Seller: the seller's own returns with policy, payment, deadlines, inspection and
earnings impact (ReturnCase). Admin: the full case with owner, exception record and refund request.
"""
type Return {
  id: UUID!
  "RT-YYMMDD-NNNN"
  ref: String!
  orderId: UUID!
  "MK-… reference of the original order"
  orderRef: String!
  ownerType: ReturnOwnerType!
  "Null for the Official Store"
  sellerId: UUID
  sellerName: String!
  status: ReturnStatus!
  "Store: customer wording, e.g. Approved: send it back. Seller and Admin Center: seller and staff wording, as their lists show it, e.g. Return requested"
  statusLabel: String!
  "Item track: Requested, Approved, Sent back, Received, Inspected, Refunded (or Replaced)"
  track: [ReturnTrackStep!]!
  items: [ReturnItem!]!
  itemCount: Int!
  "Customer reason, e.g. Arrived damaged"
  reason: String!
  "What the customer wrote"
  details: String
  "Customer photos"
  media: [MediaRef!]!
  "Remedy the customer asked for"
  remedy: ReturnRemedyKind!
  handledBy: ReturnHandler!
  "When the seller (or Marketly) must respond"
  responseDue: Deadline
  infoRequest: ReturnInfoRequest
  decision: ReturnDecision
  "Return label and tracking, separate from the original delivery"
  shipment: ReturnShipment
  "Refund progress (Requested, Under review, Approved, Processing, Sent), kept apart from the return status"
  refund: ReturnRefund
  "Before the refund is decided: what the customer can expect back (isEstimate true); null once refund is set"
  refundEstimate: ReturnRefundBreakdown
  "Replacement or exchange, with its own shipment"
  replacement: ReturnReplacement
  "Return terms accepted at purchase (frozen on the order item)"
  terms: ReturnTerms!
  escalation: ReturnEscalation
  timeline: [TimelineEvent!]!
  "Plain next step, e.g. Drop off by Thu, Oct 15"
  nextStep: String!
  nextDeadline: Deadline
  "Not completed or cancelled"
  open: Boolean!
  requestedAt: DateTime!
  "What the customer can do now"
  actions: [ReturnCustomerAction!]! @areas(in: [STORE])
}

enum ReturnOwnerType {
  OFFICIAL
  SELLER
}

enum ReturnStatus {
  REQUESTED
  INFO_REQUESTED
  APPROVED
  REJECTED
  IN_TRANSIT
  RECEIVED
  AWAITING_REMEDY
  COMPLETED
  CANCELLED
}

"STORE_CREDIT needs the wallet module (phase 3)"
enum ReturnRemedyKind {
  REFUND
  REPLACEMENT
  EXCHANGE
  STORE_CREDIT
}

enum ReturnHandler {
  SELLER
  OFFICIAL_STORE
  MARKETPLACE_SUPPORT
}

enum ReturnCustomerAction @areas(in: [STORE]) {
  WITHDRAW
  REPLY_INFO
  GET_LABEL
  ADD_TRACKING
  ESCALATE
  REPORT_PROBLEM
}

enum ReturnShippingPayer {
  SELLER
  CUSTOMER
  PLATFORM
}

"One step of a status track (return or refund)"
type ReturnTrackStep {
  key: String!
  label: String!
  state: ReturnStepState!
}

enum ReturnStepState {
  DONE
  CURRENT
  UPCOMING
}

"A returned order item (snapshot of what was bought)"
type ReturnItem {
  orderItemId: UUID!
  productId: UUID!
  variantId: UUID!
  title: String!
  "e.g. Color → Cream"
  options: [VariantOption!]!
  sku: String
  imageUrl: URL
  quantity: Int!
  unitPrice: Money!
}

"A question from the seller or Marketly; the respond-by clock pauses until the customer replies"
type ReturnInfoRequest {
  question: String!
  askedBy: Actor!
  askedAt: DateTime!
  replyDueAt: DateTime!
  reply: String
  replyMedia: [MediaRef!]!
  repliedAt: DateTime
}

type ReturnDecision {
  kind: ReturnDecisionKind!
  reasonCode: String
  "Shown to the customer"
  explanation: String
  decidedBy: Actor!
  decidedAt: DateTime!
  "True when Marketly decided instead of the seller"
  platformDecision: Boolean!
}

enum ReturnDecisionKind {
  APPROVED
  APPROVED_WITHOUT_RETURN
  REJECTED
  OVERTURNED
}

"The return shipment: drop-off code or label, instructions and tracking"
type ReturnShipment {
  id: UUID!
  status: ReturnShipmentStatus!
  method: ReturnLabelMethod!
  carrier: String
  service: String
  trackingNumber: String
  trackingUrl: URL
  labelUrl: URL
  "Drop-off link the QR encodes (prepaid QR)"
  qrCodeUrl: URL
  "Prepaid QR: the code the carrier scans at drop-off; apps draw the QR from it"
  dropOffCode: String
  dropOffBy: DateTime
  dropOffPoints: [ReturnDropOffPoint!]!
  instructions: [String!]!
  from: Address
  to: Address!
  cost: Money
  paidBy: ReturnShippingPayer!
  "Shipment record in the shipping module"
  shippingShipmentId: UUID
  events: [TimelineEvent!]!
}

enum ReturnShipmentStatus {
  LABEL_ISSUED
  IN_TRANSIT
  DELIVERED
  EXCEPTION
  EXPIRED
}

enum ReturnLabelMethod {
  PREPAID_QR
  PREPAID_LABEL
  CUSTOMER_ARRANGED
}

type ReturnDropOffPoint {
  name: String!
  address: String!
  distanceMiles: Float
  hours: String
}

"Customer-facing refund progress for a return"
type ReturnRefund {
  id: UUID!
  "RF-YYMMDD-NNNN"
  ref: String!
  status: RefundRequestStatus!
  statusLabel: String!
  track: [ReturnTrackStep!]!
  breakdown: ReturnRefundBreakdown!
  approvedAt: DateTime
  sentAt: DateTime
  failedReason: String
  expectedBy: DateTime
  bankReference: String
  "Plain words, e.g. Approved still means the money hasn't been sent"
  explanation: String!
}

"Plan ch. 13 refund statuses. APPROVED is not money sent; SENT means it left Marketly."
enum RefundRequestStatus {
  REQUESTED
  UNDER_REVIEW
  APPROVED
  DECLINED
  PROCESSING
  SENT
  FAILED
  CANCELLED
}

"How a refund amount is made up"
type ReturnRefundBreakdown {
  itemAmount: Money!
  "Coupon share allocated to the returned items (subtracted)"
  discountShare: Money!
  shippingRefund: Money!
  returnShippingDeduction: Money!
  deductions: [ReturnRefundDeduction!]!
  total: Money!
  "Remaining refundable amount for these items"
  maxRefundable: Money!
  "e.g. Visa •••• 4417, or Marketly store credit"
  destination: String!
  isEstimate: Boolean!
}

type ReturnRefundDeduction {
  label: String!
  amount: Money!
  reason: String!
}

type ReturnReplacement {
  id: UUID!
  kind: ReturnReplacementKind!
  status: ReturnReplacementStatus!
  variantId: UUID!
  title: String!
  options: [VariantOption!]!
  quantity: Int!
  "e.g. Same item, no charge"
  chargeNote: String!
  carrier: String
  trackingNumber: String
  estimatedDelivery: Date
  "A replacement gets a new return window"
  newReturnWindowEnds: Date
  cancelReason: String
  createdAt: DateTime!
}

enum ReturnReplacementKind {
  REPLACEMENT
  EXCHANGE
}

enum ReturnReplacementStatus {
  PENDING
  RESERVED
  SHIPPED
  DELIVERED
  CANCELLED
}

"Effective return terms: baseline, category exception and seller terms combined"
type ReturnTerms {
  windowDays: Int!
  changeOfMindAllowed: Boolean!
  "e.g. Unopened and sealed"
  condition: String
  responsibilities: [ReturnShippingRule!]!
  remedies: [ReturnRemedyKind!]!
  responseTargetBusinessDays: Int!
  "One line, e.g. 30-day returns, free for defects"
  summary: String!
  policyVersion: String!
  sellerTermsVersion: Int
  source: ReturnTermsSource!
}

enum ReturnTermsSource {
  BASELINE
  SELLER_TERMS
  CATEGORY_EXCEPTION
}

"Who pays return shipping for a group of reasons"
type ReturnShippingRule {
  reasonGroup: ReturnReasonGroup!
  paidBy: ReturnShippingPayer!
  "Deducted from the refund when the customer pays, e.g. $7.99 for change of mind"
  customerFee: Money
  originalShippingRefunded: Boolean!
  "Official Store wording, e.g. Free for every reason"
  officialStoreRule: String
  note: String
}

enum ReturnReasonGroup {
  DAMAGED
  INCORRECT
  DEFECTIVE
  NOT_AS_DESCRIBED
  MISSING_PARTS
  CHANGE_OF_MIND
  LOST_IN_TRANSIT
}

"The customer asked Marketly to step in"
type ReturnEscalation {
  at: DateTime!
  by: Actor!
  reason: ReturnEscalationReason!
  note: String
  caseId: UUID
  caseRef: String
}

enum ReturnEscalationReason {
  SELLER_NO_RESPONSE
  SELLER_MISSED_INSPECTION
  CUSTOMER_DISAGREES
  REFUND_LATE
  SELLER_REJECTED
  OTHER
}

type ReturnPage implements Paged {
  items: [Return!]!
  nextCursor: String
  page: Int
  totalPages: Int
  total: Int
}

enum ReturnListState {
  OPEN
  COMPLETED
  ALL
}

"Whether an order item can be returned now, and its latest return"
type ReturnEligibility @areas(in: [STORE, ADMIN]) {
  eligible: Boolean!
  ineligibleReason: ReturnIneligibleReason
  "e.g. Return by Sat, Oct 17 / Not shipped yet. You can cancel it instead."
  message: String!
  quantityPurchased: Int!
  quantityReturnable: Int!
  returnBy: DateTime
  "Open or most recent return of this item, with return and refund status side by side"
  latestReturn: ReturnItemState
}

enum ReturnIneligibleReason @areas(in: [STORE, ADMIN]) {
  NOT_DELIVERED
  NOT_SHIPPED
  WINDOW_CLOSED
  RETURN_OPEN
  FINAL_SALE
  CATEGORY_EXCLUDED
  ALREADY_RETURNED
  CANCELLED
}

type ReturnItemState @areas(in: [STORE, ADMIN]) {
  returnId: UUID!
  ref: String!
  status: ReturnStatus!
  statusLabel: String!
  refundStatus: RefundRequestStatus
}

"Return and refund totals for the account"
type ReturnsOverview @areas(in: [STORE]) {
  openReturns: Int!
  "e.g. 1 needs drop-off by Oct 15"
  openNote: String
  refundsOnTheWay: Money!
  refundsOnTheWayNote: String
  refundedThisYear: Money!
  completedThisYear: Int!
}

extend type Order {
  "Returns on this order, newest first. Seller area: only the caller's own returns."
  returns: [Return!]! @source(module: "returns", fn: "listForOrder") @cost(weight: 5)
}

extend type OrderItem {
  "Return window and eligibility now, plus the item's latest return"
  returnEligibility: ReturnEligibility @areas(in: [STORE, ADMIN]) @source(module: "returns", fn: "eligibilityForItems")
}

extend type Customer {
  "Account overview and returns page totals"
  returnsOverview: ReturnsOverview @areas(in: [STORE]) @source(module: "returns", fn: "customerOverview") @cost(weight: 3)
  "Open returns, newest first, for the account overview"
  openReturns(limit: Int = 3): ReturnPage! @areas(in: [STORE]) @source(module: "returns", fn: "listOpenForCustomer")
}

extend type Seller {
  "Storefront returns section: the seller's standard terms for new items (category exceptions show per offer on the product page)"
  returnTerms: ReturnTerms @areas(in: [STORE]) @source(module: "returns", fn: "sellerReturnTermsFor")
}

extend type Case

extend type Query {
  "Return detail for the signed-in customer (or a guest order session)"
  return(ref: String!): Return @areas(in: [STORE]) @auth(requires: SHOPPER) @source(module: "returns", fn: "getReturnForCustomer")
  "My returns, return status and refund status side by side"
  returns(state: ReturnListState = OPEN, paging: PageInput): ReturnPage @areas(in: [STORE]) @auth(requires: CUSTOMER) @source(module: "returns", fn: "listForCustomer")
}

# ---------------------------------------------------------------- module: reviews

"A published product review"
type Review {
  id: UUID!
  productId: UUID!
  "e.g. Color: Midnight black"
  variantLabel: String
  author: ReviewAuthor!
  "1–5"
  rating: Int!
  headline: String!
  text: String!
  media: [MediaRef!]!
  "Who sold the reviewed item"
  soldBy: ReviewSoldBy!
  reviewedAt: DateTime!
  editedAt: DateTime
  helpfulCount: Int!
  "Null without a customer session"
  viewerVotedHelpful: Boolean
  "Public response from the seller or the Official Store"
  response: ReviewResponse
}

type ReviewAuthor {
  kind: ReviewAuthorKind!
  "e.g. Mara D."
  displayName: String!
  "Bought this product on Marketly"
  verifiedPurchase: Boolean!
}

enum ReviewAuthorKind {
  CUSTOMER
  SELLER
  STAFF
}

type ReviewSoldBy {
  "OFFICIAL_STORE_ID for the Official Store"
  sellerId: UUID
  name: String!
}

"A public seller response to a review or feedback, checked against the response rules"
type ReviewResponse {
  id: UUID!
  "e.g. Marketly Official Store / Northwind Audio"
  fromName: String!
  fromKind: ReviewResponseFrom!
  text: String!
  publishedAt: DateTime
}

enum ReviewResponseFrom {
  SELLER
  OFFICIAL_STORE
}

"Product rating summary. hasReviews false shows the honest no-reviews state without stars."
type ReviewSummary {
  productId: UUID!
  hasReviews: Boolean!
  "Null until there are reviews"
  average: Float
  ratingCount: Int!
  writtenCount: Int!
  "5 to 1 stars"
  distribution: [ReviewRatingBucket!]!
  answeredQuestions: Int!
  withPhotos: Int!
}

type ReviewRatingBucket {
  stars: Int!
  count: Int!
  pct: Int!
}

type ReviewPage implements Paged {
  items: [Review!]!
  nextCursor: String
  page: Int
  totalPages: Int
  total: Int
}

enum ReviewSort {
  MOST_HELPFUL
  NEWEST
  HIGHEST_RATED
  LOWEST_RATED
}

"A product question with answers labelled by who answered"
type Question {
  id: UUID!
  productId: UUID!
  text: String!
  "e.g. a shopper / Marcus J."
  askedBy: String!
  askedAt: DateTime!
  answers: [Answer!]!
  answerCount: Int!
  "Only while unanswered, e.g. The Official Store usually answers within 1 business day"
  answerExpectation: String
}

type Answer {
  id: UUID!
  text: String!
  by: ReviewAuthor!
  "Shown as Answer from the seller / Marketly staff / Customer"
  label: AnswerLabel!
  answeredAt: DateTime!
  helpfulCount: Int!
}

enum AnswerLabel {
  SELLER
  MARKETLY_STAFF
  CUSTOMER
}

type QuestionPage implements Paged {
  items: [Question!]!
  nextCursor: String
  page: Int
  totalPages: Int
  total: Int
}

"Feedback about a seller's shipping, packaging and communication for one package (not about the product)"
type SellerFeedback {
  id: UUID!
  sellerId: UUID!
  author: ReviewAuthor!
  "Item as described"
  asDescribed: Boolean!
  "1–5"
  dispatchRating: Int!
  "1–5; null when the customer did not contact the seller"
  communicationRating: Int
  "1–5, drives positive / neutral / negative"
  overall: Int!
  sentiment: SellerFeedbackSentiment!
  comment: String
  "What was bought, for context on the storefront"
  itemTitle: String
  postedAt: DateTime!
  editedAt: DateTime
  response: ReviewResponse
}

enum SellerFeedbackSentiment {
  POSITIVE
  NEUTRAL
  NEGATIVE
}

type SellerFeedbackPage implements Paged {
  items: [SellerFeedback!]!
  nextCursor: String
  page: Int
  totalPages: Int
  total: Int
}

"""
Seller feedback summary over the last 12 months, e.g. 98% positive · 4,812 ratings. Also given for the Official Store
(official true, sellerId OFFICIAL_STORE_ID), which collects the same package feedback.
"""
type SellerRating {
  "OFFICIAL_STORE_ID for the Official Store"
  sellerId: UUID
  "True for the Official Store"
  official: Boolean!
  periodMonths: Int!
  count: Int!
  "Average overall feedback score, 1–5. Null until there is feedback."
  average: Float
  "Null until the seller has feedback"
  positivePct: Int
  neutralPct: Int
  negativePct: Int
  asDescribedPct: Int
  avgDispatch: Float
  avgCommunication: Float
  "Packages dispatched by their deadline, last 90 days (from shipping's dispatch metrics). Null with too few orders or without shipping."
  onTimeDispatchPct: Float
  "e.g. 98% positive · 4,812 ratings"
  label: String!
}

"Review and feedback state of a purchased item for the customer's order page"
type ReviewItemStatus @areas(in: [STORE]) {
  "Delivered and not yet reviewed"
  canReview: Boolean!
  reviewBy: DateTime
  reviewId: UUID
  status: ReviewStatus
  "e.g. Published / Hidden: under review"
  statusLabel: String
  rating: Int
  "Seller feedback can be left for this item's package"
  feedbackEligible: Boolean!
  feedbackGiven: Boolean!
}

enum ReviewStatus @areas(in: [STORE]) {
  DRAFT
  PENDING
  PUBLISHED
  HELD
  EDIT_REQUESTED
  REMOVED
  DELETED
}

extend type Product {
  "Average, count, distribution and answered questions (batched for product cards)"
  reviewSummary: ReviewSummary! @source(module: "reviews", fn: "getRatingSummaries")
  "Published reviews with filters and sorting"
